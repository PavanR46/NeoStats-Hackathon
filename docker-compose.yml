version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: neostats_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neostats_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neostats_password}
      POSTGRES_DB: ${POSTGRES_DB:-neostats_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neostats_user} -d ${POSTGRES_DB:-neostats_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
